        tests:
          - not_null
      - name: unique_contacts
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - month_date
              - contact_channel
              - channel_group
              - product_promoted
              - device_type_name